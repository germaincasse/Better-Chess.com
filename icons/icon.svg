<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fd068"/>
      <stop offset="0.55" stop-color="#6aa33f"/>
      <stop offset="1" stop-color="#3b6e2a"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="piece" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6efdc"/>
    </linearGradient>
    <!-- Knight silhouette: cburnett knight (Colin M.L. Burnett, GPLv2+) without strokes, plus a base. -->
    <g id="knight">
      <path d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/>
      <path d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3"/>
      <rect x="12.5" y="38" width="28" height="5" rx="2.2"/>
    </g>
  </defs>

  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <rect width="128" height="128" rx="30" fill="url(#shine)"/>

  <g transform="translate(6.5 -4) scale(2.55)">
    <use href="#knight" fill="#1f3d16" opacity="0.35" transform="translate(1.1 1.4)"/>
    <use href="#knight" fill="url(#piece)"/>
    <circle cx="14.2" cy="16.3" r="1.25" fill="#3b6e2a"/>
  </g>

  <!-- Insight spark -->
  <path d="M101 18l3.6 9.4 9.4 3.6-9.4 3.6L101 44l-3.6-9.4L88 31l9.4-3.6Z" fill="#ffd54a"/>
</svg>
